name: 💡 Feature Request
description: Suggest an idea, improvement, or new format support
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea or want support for a new format/tool? Let us know below.

  - type: textarea
    id: feature_summary
    attributes:
      label: Feature Description
      description: What feature or tool would you like to see added to YHG Assets Handler?
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Why is this needed?
      description: Explain the use case or how this will help modding workflows.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context / Samples
      description: Add any sample file details, reference links, or screenshots.
